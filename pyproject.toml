[project]
name = "texture-penalized-confidence"
version = "0.1.0"
description = "Texture-penalized confidence for accepting the outputs of a Landsat-8-trained cloud mask on Sentinel-2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "torch",
    "scikit-learn",
    "tifffile",
    "netcdf4",
    "hypso==26.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboard"]
